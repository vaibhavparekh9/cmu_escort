<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CMU Escort</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }

        body {
            background: #941120;
            font-family: 'Roboto', 'Open Sans', sans-serif;
            font-weight: 300;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px 14px;
            flex-shrink: 0;
        }
        .header h1 { font-size: 22px; font-weight: 300; letter-spacing: 0.3px; }

        .btn-sim {
            background: #fff;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 300;
            font-size: 12px;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn-sim:active { opacity: 0.8; }

        .section-label {
            padding: 0 20px 10px;
            font-size: 12px;
            opacity: 0.55;
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .stops-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
            -webkit-overflow-scrolling: touch;
        }
        .stop-chip {
            background: rgba(255,255,255,0.12);
            padding: 13px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .stop-chip .num {
            font-weight: 400;
            opacity: 0.45;
            font-size: 13px;
            min-width: 18px;
            text-align: right;
        }
        .empty-state {
            text-align: center;
            opacity: 0.4;
            margin-top: 80px;
            font-size: 15px;
            line-height: 1.7;
        }

        .actions {
            padding: 14px 20px 32px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 300;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.15s;
            position: relative;
        }
        .btn:active { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .btn.loading { color: transparent; }
        .btn.loading::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            top: 50%; left: 50%;
            margin: -10px 0 0 -10px;
            border: 2px solid #ddd;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            pointer-events: none;
            transition: background 0.25s;
        }
        .modal-overlay.active { background: rgba(0,0,0,0.5); pointer-events: auto; }

        .modal {
            background: #7a0e1a;
            width: 100%;
            max-height: 0;
            border-radius: 20px 20px 0 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .modal-overlay.active .modal { max-height: 70vh; }

        .modal-inner {
            padding: 20px 20px 28px;
            overflow-y: auto;
            max-height: 70vh;
            -webkit-overflow-scrolling: touch;
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .modal-head h2 { font-size: 17px; font-weight: 300; }
        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            opacity: 0.7;
            line-height: 1;
        }
        .modal-item {
            background: #fff;
            color: #000;
            padding: 13px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 15px;
            font-family: inherit;
            font-weight: 300;
            transition: opacity 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-item:active { opacity: 0.85; }
        .modal-item.added { opacity: 0.35; pointer-events: none; }
        .modal-item .check { font-size: 13px; opacity: 0.5; }

        .toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: #fff;
            color: #000;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 300;
            z-index: 200;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.err { background: #ffe0e0; }
    </style>

// ── Math ───────────────────────────────────────────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
    var R = 6371000, toRad = Math.PI / 180;
    var dLat = (lat2 - lat1) * toRad, dLon = (lon2 - lon1) * toRad;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ── TSP: Held-Karp (exact, for n <= 18) ────────────────────────────────────────
function heldKarp(D, n) {
    var ALL = (1 << n) - 1;
    var dp = new Float64Array((1 << n) * n);
    var par = new Int8Array((1 << n) * n);
    var i, mask, u, v, nm, nc, idx;
    for (i = 0; i < dp.length; i++) { dp[i] = BIG_M; par[i] = -1; }
    dp[1 * n + 0] = 0;

    for (mask = 1; mask <= ALL; mask++) {
        for (u = 0; u < n; u++) {
            idx = mask * n + u;
            if (!(mask & (1 << u)) || dp[idx] >= BIG_M) continue;
            for (v = 0; v < n; v++) {
                if (mask & (1 << v)) continue;
                nm = mask | (1 << v);
                nc = dp[idx] + D[u * n + v];
                if (nc < dp[nm * n + v]) {
                    dp[nm * n + v] = nc;
                    par[nm * n + v] = u;
                }
            }
        }
    }

    var best = BIG_M, last = -1;
    for (u = 1; u < n; u++) {
        var c = dp[ALL * n + u] + D[u * n + 0];
        if (c < best) { best = c; last = u; }
    }

    var path = [];
    mask = ALL; u = last;
    while (u !== 0) {
        path.push(u);
        var p = par[mask * n + u];
        mask ^= (1 << u);
        u = p;
    }
    path.push(0);
    path.reverse();
    return path;
}

// ── TSP: Nearest-neighbor + 2-opt (heuristic, for n > 18) ─────────────────────
function nearestNeighbor(D, n) {
    var visited = new Uint8Array(n);
    var path = [0]; visited[0] = 1;
    var cur = 0;
    for (var step = 1; step < n; step++) {
        var best = -1, bestD = BIG_M;
        for (var v = 0; v < n; v++) {
            if (visited[v]) continue;
            var d = D[cur * n + v];
            if (d < bestD) { bestD = d; best = v; }
        }
        path.push(best);
        visited[best] = 1;
        cur = best;
    }
    return path;
}

function tourCost(D, n, path) {
    var c = 0;
    for (var i = 0; i < path.length - 1; i++) c += D[path[i] * n + path[i+1]];
    c += D[path[path.length-1] * n + path[0]];
    return c;
}

function twoOpt(D, n, path) {
    var improved = true;
    while (improved) {
        improved = false;
        for (var i = 1; i < path.length - 1; i++) {
            for (var j = i + 1; j < path.length; j++) {
                var a = path[i-1], b = path[i], c = path[j], d = path[(j+1) % path.length];
                var old = D[a*n+b] + D[c*n+d];
                var nw  = D[a*n+c] + D[b*n+d];
                if (nw < old - 0.5) {
                    var seg = path.slice(i, j+1);
                    seg.reverse();
                    for (var x = 0; x < seg.length; x++) path[i+x] = seg[x];
                    improved = true;
                }
            }
        }
    }
    return path;
}

// ── Route planner ──────────────────────────────────────────────────────────────
function planRouteLogic(codes) {
    var k = codes.length;
    if (k === 0) {
        return fmtUrl(ORIGIN.lat, ORIGIN.lon, DEST.lat, DEST.lon, []);
    }

    var n = k + 2;
    var D = new Float64Array(n * n);
    var gIdx = codes.map(function(c) { return codeToIdx[c]; });
    var sLat = gIdx.map(function(i) { return MD.lats[i]; });
    var sLon = gIdx.map(function(i) { return MD.lons[i]; });
    var DES = n - 1;
    var i, j;

    for (i = 0; i < k; i++) {
        for (j = 0; j < k; j++) {
            D[(1+i)*n + (1+j)] = (i === j) ? 0 : MD.dist_m[gIdx[i]][gIdx[j]];
        }
    }

    for (j = 0; j < k; j++) {
        D[0*n + (1+j)]     = haversine(ORIGIN.lat, ORIGIN.lon, sLat[j], sLon[j]);
        D[(1+j)*n + 0]     = BIG_M;
        D[(1+j)*n + DES]   = haversine(sLat[j], sLon[j], DEST.lat, DEST.lon);
        D[DES*n + (1+j)]   = BIG_M;
    }

    D[0*n + DES] = haversine(ORIGIN.lat, ORIGIN.lon, DEST.lat, DEST.lon);
    D[DES*n + 0] = 0;

    var perm;
    if (n <= 18) {
        perm = heldKarp(D, n);
    } else {
        perm = nearestNeighbor(D, n);
        perm = twoOpt(D, n, perm);
    }

    var waypoints = [];
    for (i = 1; i < perm.length; i++) {
        if (perm[i] === DES) break;
        var si = perm[i] - 1;
        waypoints.push({lat: sLat[si], lon: sLon[si]});
    }

    return fmtUrl(ORIGIN.lat, ORIGIN.lon, DEST.lat, DEST.lon, waypoints);
}

function fmtUrl(oLat, oLon, dLat, dLon, wps) {
    var url = 'https://www.google.com/maps/dir/?api=1'
        + '&origin=' + oLat.toFixed(6) + ',' + oLon.toFixed(6)
        + '&destination=' + dLat.toFixed(6) + ',' + dLon.toFixed(6);
    if (wps.length) {
        url += '&waypoints=' + wps.map(function(w) { return w.lat.toFixed(6)+','+w.lon.toFixed(6); }).join('|');
    }
    url += '&travelmode=driving';
    return url;
}

// ── UI ─────────────────────────────────────────────────────────────────────────
function render() {
    var area = document.getElementById('stopsArea');
    document.getElementById('label').textContent = 'Stops (' + stopOrder.length + ')';
    if (!stopOrder.length) {
        area.innerHTML = '<div class="empty-state">No stops added yet.<br>Tap Simulate Tap or add manually.</div>';
        return;
    }
    area.innerHTML = stopOrder.map(function(c, i) {
        return '<div class="stop-chip"><span class="num">' + (i+1) + '</span>' + c + '</div>';
    }).join('');
    area.scrollTop = area.scrollHeight;
}

var _tid;
function toast(msg, err) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(_tid);
    _tid = setTimeout(function() { t.className = 'toast'; }, 2200);
}

function simulateTap() {
    var used = new Set(stopOrder);
    var avail = MD.codes.filter(function(c) { return !used.has(c); });
    if (!avail.length) { toast('All stops already added', true); return; }
    var code = avail[Math.floor(Math.random() * avail.length)];
    stopOrder.push(code);
    render();
    toast('Added ' + code);
}

function clearLast() {
    if (!stopOrder.length) { toast('No stops to clear', true); return; }
    var removed = stopOrder.pop();
    render();
    toast('Removed ' + removed);
}

function openModal() {
    var el = document.getElementById('modalList');
    var cur = new Set(stopOrder);
    el.innerHTML = MD.codes.map(function(code) {
        var added = cur.has(code);
        return '<div class="modal-item' + (added ? ' added' : '') + '" onclick="addStop(\'' + code + '\')">'
            + '<span>' + code + '</span>'
            + (added ? '<span class="check">added</span>' : '')
            + '</div>';
    }).join('');
    document.getElementById('overlay').classList.add('active');
}

function closeModal() {
    document.getElementById('overlay').classList.remove('active');
}

document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

function addStop(code) {
    if (stopOrder.indexOf(code) !== -1) { toast('Stop already added', true); return; }
    stopOrder.push(code);
    render();
    closeModal();
    toast('Added ' + code);
}

function planRoute() {
    if (!stopOrder.length) { toast('Add at least one stop first', true); return; }
    var btn = document.getElementById('btnPlan');
    btn.classList.add('loading');
    btn.disabled = true;
    setTimeout(function() {
        try {
            var url = planRouteLogic(stopOrder);
            window.location.href = url;
        } catch(e) {
            toast('Route planning failed: ' + e.message, true);
        }
        btn.classList.remove('loading');
        btn.disabled = false;
    }, 50);
}

render();
</script>
