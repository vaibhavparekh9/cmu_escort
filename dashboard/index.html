<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CMU Escort</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }

        body {
            background: #941120;
            font-family: 'Open Sans', sans-serif;
            font-weight: 300;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px 14px;
            flex-shrink: 0;
        }
        .header h1 { font-size: 22px; font-weight: 300; letter-spacing: 0.3px; }

        .btn-sim {
            background: #fff;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-family: 'Open Sans', sans-serif;
            font-weight: 300;
            font-size: 12px;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn-sim:active { opacity: 0.8; }

        /* ── Section label ── */
        .section-label {
            padding: 0 20px 10px;
            font-size: 12px;
            opacity: 0.55;
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* ── Stops list ── */
        .stops-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
            -webkit-overflow-scrolling: touch;
        }
        .stop-chip {
            background: rgba(255, 255, 255, 0.12);
            padding: 13px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .stop-chip .num {
            font-weight: 400;
            opacity: 0.45;
            font-size: 13px;
            min-width: 18px;
            text-align: right;
        }
        .empty-state {
            text-align: center;
            opacity: 0.4;
            margin-top: 80px;
            font-size: 15px;
            line-height: 1.7;
        }

        /* ── Bottom actions ── */
        .actions {
            padding: 14px 20px 32px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: 'Open Sans', sans-serif;
            font-weight: 300;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.15s;
            position: relative;
        }
        .btn:active { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .btn.loading { color: transparent; }
        .btn.loading::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            top: 50%; left: 50%;
            margin: -10px 0 0 -10px;
            border: 2px solid #ddd;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            pointer-events: none;
            transition: background 0.25s;
        }
        .modal-overlay.active { background: rgba(0, 0, 0, 0.5); pointer-events: auto; }

        .modal {
            background: #7a0e1a;
            width: 100%;
            max-height: 0;
            border-radius: 20px 20px 0 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .modal-overlay.active .modal { max-height: 70vh; }

        .modal-inner {
            padding: 20px 20px 28px;
            overflow-y: auto;
            max-height: 70vh;
            -webkit-overflow-scrolling: touch;
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .modal-head h2 { font-size: 17px; font-weight: 300; }
        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            opacity: 0.7;
            line-height: 1;
        }
        .modal-item {
            background: #fff;
            color: #000;
            padding: 13px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 15px;
            font-family: 'Open Sans', sans-serif;
            font-weight: 300;
            transition: opacity 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-item:active { opacity: 0.85; }
        .modal-item.added { opacity: 0.35; pointer-events: none; }
        .modal-item .check { font-size: 13px; opacity: 0.5; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: #fff;
            color: #000;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Open Sans', sans-serif;
            font-weight: 300;
            z-index: 200;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.err { background: #ffe0e0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>CMU Escort</h1>
        <button class="btn-sim" onclick="simulateTap()">Simulate Tap</button>
    </div>

    <div class="section-label" id="label">Stops (0)</div>

    <div class="stops-area" id="stopsArea">
        <div class="empty-state">No stops added yet.<br>Tap Simulate Tap or add manually.</div>
    </div>

    <div class="actions">
        <button class="btn" onclick="clearLast()">Clear Last Added Stop</button>
        <button class="btn" onclick="openModal()">Add Stop Manually</button>
        <button class="btn" id="btnPlan" onclick="planRoute()">Plan Route</button>
    </div>

    <div class="modal-overlay" id="overlay">
        <div class="modal">
            <div class="modal-inner">
                <div class="modal-head">
                    <h2>Select a stop</h2>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div id="modalList"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let allStops = {};
        let stops = {};

        async function init() {
            const [aRes, sRes] = await Promise.all([
                fetch('/api/all-stops'),
                fetch('/api/stops')
            ]);
            allStops = await aRes.json();
            stops = await sRes.json();
            render();
        }

        function render() {
            const area = document.getElementById('stopsArea');
            const keys = Object.keys(stops);
            document.getElementById('label').textContent = 'Stops (' + keys.length + ')';
            if (!keys.length) {
                area.innerHTML = '<div class="empty-state">No stops added yet.<br>Tap Simulate Tap or add manually.</div>';
                return;
            }
            area.innerHTML = keys.map((c, i) =>
                '<div class="stop-chip"><span class="num">' + (i + 1) + '</span>' + stops[c].name + '</div>'
            ).join('');
            area.scrollTop = area.scrollHeight;
        }

        function toast(msg, err) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (err ? ' err' : '');
            clearTimeout(toast._tid);
            toast._tid = setTimeout(() => t.className = 'toast', 2200);
        }

        async function simulateTap() {
            const res = await fetch('/api/simulate-tap', { method: 'POST' });
            const d = await res.json();
            if (!res.ok) { toast(d.error, true); return; }
            stops = d.stops;
            render();
            toast('Added ' + d.added);
        }

        async function clearLast() {
            const res = await fetch('/api/clear-last', { method: 'POST' });
            const d = await res.json();
            if (!res.ok) { toast(d.error, true); return; }
            stops = d.stops;
            render();
            toast('Removed ' + d.removed);
        }

        function openModal() {
            const el = document.getElementById('modalList');
            const cur = new Set(Object.keys(stops));
            el.innerHTML = Object.keys(allStops).map(code => {
                const added = cur.has(code);
                return '<div class="modal-item' + (added ? ' added' : '') + '" onclick="addStop(\'' + code + '\')">'
                    + '<span>' + allStops[code].name + '</span>'
                    + (added ? '<span class="check">added</span>' : '')
                    + '</div>';
            }).join('');
            document.getElementById('overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('overlay').classList.remove('active');
        }

        document.getElementById('overlay').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        async function addStop(code) {
            const res = await fetch('/api/add-stop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });
            const d = await res.json();
            if (!res.ok) { toast(d.error, true); return; }
            stops = d.stops;
            render();
            closeModal();
            toast('Added ' + d.added);
        }

        async function planRoute() {
            const btn = document.getElementById('btnPlan');
            btn.classList.add('loading');
            btn.disabled = true;
            try {
                const res = await fetch('/api/plan-route', { method: 'POST' });
                const d = await res.json();
                if (!res.ok) { toast(d.error, true); return; }
                window.location.href = d.url;
            } catch (e) {
                toast('Route planning failed', true);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        init();
    </script>
</body>
</html>
